backend:
  name: github
  repo: chenoaventuras/chenoaventuras.com
  branch: main
  base_url: https://www.chenoaventuras.com
  auth_endpoint: /api/auth
  commit_messages:
    create: 'Blog: nuevo artículo "{{slug}}"'
    update: 'Blog: edita "{{slug}}"'
    delete: 'Blog: borra "{{slug}}"'
    uploadMedia: 'Blog: sube {{path}}'
    deleteMedia: 'Blog: borra {{path}}'

publish_mode: simple
media_folder: assets/img/blog/uploads
public_folder: /assets/img/blog/uploads
locale: es

collections:
  - name: blog
    label: Artículos del blog
    label_singular: Artículo
    description: Escribe aquí. Al publicar se sube y la web se actualiza sola en un minuto.
    folder: content/blog
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Título, widget: string }
      - {
          name: date,
          label: Fecha,
          widget: datetime,
          date_format: 'DD/MM/YYYY',
          time_format: 'HH:mm',
          format: 'YYYY-MM-DDTHH:mm:ss.SSSZ',
        }
      - {
          name: excerpt,
          label: 'Resumen (sale en Google y en el listado)',
          widget: text,
          hint: 'Una o dos frases. Máx. ~160 caracteres.',
        }
      - { name: cover, label: Foto de portada, widget: image, required: false }
      - {
          name: draft,
          label: 'Borrador (marca esto para NO publicarlo todavía)',
          widget: boolean,
          default: false,
        }
      - { name: body, label: Contenido, widget: markdown }
      # Campos ocultos que usa el artículo automático generado desde
      # Instagram (scripts/generate-blog-post.mjs / publish-auto-drafts.mjs).
      # Declararlos aquí evita que se pierdan si el artículo se abre y se
      # guarda desde este panel antes de publicarse solo a mediodía.
      - { name: igPermalink, widget: hidden, required: false }
      - { name: autoGenerated, widget: hidden, required: false }
      - { name: autoDate, widget: hidden, required: false }
