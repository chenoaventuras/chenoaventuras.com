name: Actualizar últimas publicaciones de Instagram

# Ya no se lanza sola cada día: en la inicio solo salen los reels de la lista
# SHOW_ON_HOME (scripts/fetch-instagram.mjs). Cuando Cheno pide añadir un reel,
# se añade a esa lista y se lanza a mano desde la pestaña Actions.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Instalar cwebp (miniaturas en WebP)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Refrescar token de Instagram (evita la caducidad a los 60 días)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/refresh-instagram-token.mjs

      - name: Descargar últimas publicaciones
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_LIMIT: "all"
        run: node scripts/fetch-instagram.mjs

      - name: Commit y push si hay cambios
        run: |
          if [ -n "$(git status --porcelain assets/data/instagram.json assets/img/instagram)" ]; then
            git config user.name  "cheno-bot"
            git config user.email "chenoaventuras@gmail.com"
            git add -A assets/data/instagram.json assets/img/instagram
            git commit -m "chore: actualiza últimas publicaciones de Instagram"
            git push
          else
            echo "Sin cambios."
          fi
