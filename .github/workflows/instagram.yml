name: Actualizar últimas publicaciones de Instagram

on:
  schedule:
    - cron: "20 6 * * *"   # cada día a las 06:20 UTC
  workflow_dispatch: {}      # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar cwebp (miniaturas en WebP)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Refrescar token de Instagram (evita la caducidad a los 60 días)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/refresh-instagram-token.mjs

      - name: Descargar últimas publicaciones
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_LIMIT: "3"
        run: node scripts/fetch-instagram.mjs

      - name: Commit y push si hay cambios
        run: |
          if [ -n "$(git status --porcelain assets/data/instagram.json assets/img/instagram)" ]; then
            git config user.name  "cheno-bot"
            git config user.email "chenoaventuras@gmail.com"
            git add -A assets/data/instagram.json assets/img/instagram
            git commit -m "chore: actualiza últimas publicaciones de Instagram"
            git push
          else
            echo "Sin cambios."
          fi
