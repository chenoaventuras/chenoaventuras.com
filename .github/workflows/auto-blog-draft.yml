name: Generar borrador de blog desde Instagram

on:
  schedule:
    # 08:00 hora de España, con la misma aproximación de verano/invierno
    # que .github/workflows/instagram.yml (GitHub Actions no sigue el DST).
    - cron: "0 6 * 4-10 *"       # 08:00 CEST (horario de verano, abr-oct)
    - cron: "0 7 * 1-3,11-12 *"  # 08:00 CET  (horario de invierno, nov-mar)
  workflow_dispatch: {}      # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: auto-blog-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generar artículo (borrador) desde la última publicación de Instagram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-blog-post.mjs

      - name: Commit y push si se creó un borrador nuevo
        run: |
          if [ -n "$(git status --porcelain content/blog)" ]; then
            git config user.name  "cheno-bot"
            git config user.email "chenoaventuras@gmail.com"
            git add content/blog
            git commit -m "Blog: borrador automático desde Instagram"
            git push
          else
            echo "Sin borrador nuevo."
          fi
