name: Generar borrador de blog desde Instagram (Claude Code)

# No se dispara directamente por cron: lo dispara semanalmente
# auto-blog-draft-trigger.yml enviando un "repository_dispatch", que es
# el mecanismo que la propia documentación de anthropics/claude-code-action
# indica como soportado (a fecha de hoy, "schedule" y "workflow_dispatch"
# no están en su lista de eventos probados).
on:
  repository_dispatch:
    types: [generate-blog-draft]

permissions:
  contents: write
  id-token: write   # lo necesita anthropics/claude-code-action para su token OIDC interno

concurrency:
  group: auto-blog-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fecha de hoy
        id: today
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Redactar el borrador con Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Usa el uso incluido de una suscripción Claude Pro/Max (token
          # generado en local con `claude setup-token`), no una API key de
          # pago por token.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools Read,Write,Glob,WebSearch
            --max-turns 12
          prompt: |
            Hoy es ${{ steps.today.outputs.date }} (formato AAAA-MM-DD).

            TAREA: crear UN borrador de artículo de blog para chenoaventuras.com
            a partir de la publicación de Instagram más reciente. No toques
            git ni ningún otro fichero: solo puedes leer y escribir dentro de
            este repositorio con las herramientas Read/Write/Glob, y buscar en
            la web con WebSearch para investigar (no para copiar texto).

            1. Lee assets/data/instagram.json. Tiene la forma
               {"posts": [{"permalink", "image", "caption", "type", "timestamp"}, ...]}.
               Escoge la publicación con el timestamp más reciente.

            2. Mira los ficheros .md que ya existen en content/blog/. Cada uno
               tiene un frontmatter YAML. Si alguno tiene "igPermalink" igual
               al permalink de la publicación elegida, YA existe un artículo
               para ella: no hagas nada más y termina sin escribir nada.

            3. Identifica el destino o la actividad principal a partir del
               caption de la publicación elegida. Con WebSearch, investiga:
               - Qué busca realmente la gente sobre ese lugar/actividad (p.ej.
                 "<lugar> qué ver", "<lugar> cómo llegar", "<lugar> cuándo ir",
                 "<lugar> qué hacer", "<lugar> dónde comer", según aplique).
               - Datos reales que enriquezcan el caption (historia, cómo
                 llegar, mejores épocas, sitios cercanos, gastronomía, etc.).
               No copies frases textuales largas de ninguna fuente: usa la
               información para escribir con tus propias palabras.

            4. Si no existe todavía artículo para esa publicación, crea un
               fichero nuevo en content/blog/${{ steps.today.outputs.date }}-<slug>.md,
               donde <slug> es un slug corto en minúsculas con guiones (sin
               acentos ni caracteres especiales) derivado del título del
               artículo. El fichero debe tener EXACTAMENTE esta forma
               (frontmatter YAML entre líneas "---", luego el cuerpo en
               Markdown):

               ---
               title: "<título con la palabra clave principal, máx. 60 caracteres>"
               date: ${{ steps.today.outputs.date }}T09:00:00.000+02:00
               excerpt: "<resumen de 1-2 frases para la meta description, máx. 155 caracteres>"
               cover: "<el campo "image" de la publicación elegida; ponle una "/" delante si no la tiene ya>"
               draft: true
               igPermalink: "<el permalink EXACTO de la publicación elegida>"
               autoGenerated: true
               autoDate: "${{ steps.today.outputs.date }}"
               ---

               <cuerpo del artículo en Markdown, ~700-1100 palabras, con
               subtítulos ## para estructurarlo>

            INSTRUCCIONES DE CONTENIDO (para el cuerpo del artículo):
            - Eres quien escribe el blog de Chenoaventuras, en español de
              España. Tono cercano, aventurero y "sin filtros" (nada de
              lenguaje corporativo ni genérico), como si le contaras el viaje
              a un amigo, pero con rigor SEO.
            - Estructura el artículo en torno a lo que la gente busca de
              verdad sobre ese lugar/actividad (lo investigado en el paso 3):
              usa esas preguntas/temas como subtítulos ## siempre que tenga
              sentido, en vez de una estructura genérica.
            - Incluye, si aplica al lugar: un poco de historia/contexto, qué
              ver o hacer, cómo llegar, cuándo ir, y algún consejo práctico.
              No inventes datos muy concretos como precios u horarios exactos;
              si los mencionas, que sea de forma orientativa.
            - Añade, de forma natural dentro del texto (no solo al final), un
              enlace en Markdown al vídeo original de Instagram usando el
              permalink de la publicación elegida (igPermalink), del tipo
              "puedes ver el vídeo [aquí](<permalink>)".
            - Cierra invitando a seguir a @chenoaventuras en Instagram y a
              explorar más aventuras en la web (mención de marca breve, sin
              repetirla varias veces).

      - name: Commit y push si se creó un borrador nuevo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # anthropics/claude-code-action toca las credenciales git del runner
          # para sus propias llamadas a la API; las reponemos aquí para que el
          # push funcione pase lo que pase con eso.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if [ -n "$(git status --porcelain content/blog)" ]; then
            git config user.name  "cheno-bot"
            git config user.email "chenoaventuras@gmail.com"
            git add content/blog
            git commit -m "Blog: borrador automático desde Instagram (Claude Code)"
            git push
          else
            echo "Sin borrador nuevo."
          fi
