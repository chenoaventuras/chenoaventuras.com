name: Publicar borrador automático de blog si no se ha tocado

on:
  # DESACTIVADO (25-oct-2026): ya no se generan borradores desde Instagram.
  # schedule:
  #   - cron: "0 10 * 4-10 *"       # 12:00 CEST (horario de verano, abr-oct)
  #   - cron: "0 11 * 1-3,11-12 *"  # 12:00 CET  (horario de invierno, nov-mar)
  workflow_dispatch: {}      # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: auto-blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # historial completo: hace falta para saber si alguien ha tocado el borrador

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - run: npm ci

      - name: Publicar borradores automáticos de hoy que nadie haya tocado
        run: node scripts/publish-auto-drafts.mjs

      - name: Commit y push si se publicó algo
        run: |
          if [ -n "$(git status --porcelain content/blog)" ]; then
            git config user.name  "cheno-bot"
            git config user.email "chenoaventuras@gmail.com"
            git add content/blog
            git commit -m "Blog: publica automáticamente el borrador sin cambios"
            git push
          else
            echo "Nada que publicar."
          fi
